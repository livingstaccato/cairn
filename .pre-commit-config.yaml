# Everyday hooks run on every commit and are expected to be green. The coverage
# gate is `manual` because it is materially slower than the rest and CI enforces
# it on every push:  pre-commit run --hook-stage manual
repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]

  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        additional_dependencies: ["tomli"]

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.18.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ["@commitlint/config-conventional"]

  - repo: local
    hooks:
      - id: go-lint
        name: gofmt, vet, golangci-lint, max-loc
        entry: ci/lint.sh
        language: system
        pass_filenames: false
        types: [go]

      - id: go-test
        name: go test
        entry: go test ./...
        language: system
        pass_filenames: false
        types: [go]

      - id: js-test
        name: cairn.js tests
        entry: node --test assets/cairn/cairn.test.mjs
        language: system
        pass_filenames: false
        files: ^assets/cairn/.*\.(js|mjs)$

      - id: go-security
        name: gosec + govulncheck
        entry: ci/security.sh
        language: system
        pass_filenames: false
        types: [go]

      - id: go-coverage
        name: coverage gate (manual)
        entry: bash -c 'go test -coverprofile=coverage.out ./internal/... && ci/check-coverage.sh coverage.out'
        language: system
        pass_filenames: false
        stages: [manual]
        types: [go]
