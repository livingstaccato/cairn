name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      # false, not true: on an OS matrix a cancelled sibling hides whether the
      # other platform is healthy, which is what a cross-platform run exists to say.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # The gate scripts are POSIX shell; without this the Windows leg would
        # run them under PowerShell.
        shell: bash
    steps:
      # Source
      - uses: actions/checkout@v7
      # Toolchain
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      # Race-enabled suite with a coverage profile over the logic packages
      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./internal/...
      # Coverage floor, enforced per OS so a test that stops running on one
      # platform shows up here as a drop
      - name: Enforce coverage
        run: ci/check-coverage.sh coverage.out 90.0
      # The cairndex.css enhancement script has its own suite (pure functions
      # plus a jsdom harness over init()'s DOM wiring) — this used to run only
      # in the local pre-commit hook, so a --no-verify commit or a machine
      # without pre-commit installed could merge a broken one.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install JS dev dependencies
        run: npm ci
      - name: Run JS tests
        run: node --test assets/cairndex/*.test.mjs

  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      # The Hugo half of the gate needs Hugo
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.165.0"
          extended: true
      # cairndex build -> hugo -> assert the two halves agree
      - name: End-to-end
        run: ci/example.sh

      # Same, against corpus-hugo — a real, separately-published theme, not
      # the bare-bones themes/reference. This is what actually exercises the
      # "colors read your theme's custom properties" contract, and it's the
      # only check in this repo that reaches the network for a module import.
      - name: End-to-end (real theme)
        run: ci/example-corpus.sh

      # The Go emitters have golden tests; the templates had greps. Three
      # defects shipped through a green gate in one day, each found by reading
      # a rendered page.
      - name: Templates
        run: ci/templates.sh

      # max_rendered exists because a big directory rendered a 34 MB page. This
      # fails if the page starts tracking directory size again.
      - name: Page weight
        run: ci/pageweight.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      # golangci-lint carries gocyclo, gosec, staticcheck and the rest
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      # gofmt, vet, golangci-lint, file-size budget
      - name: Lint
        run: ci/lint.sh

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      # SAST scanner
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
      # Go vulnerability database scanner
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      # gosec, govulncheck, go mod verify
      - name: Scan
        run: ci/security.sh

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      # Every fuzz target, briefly. The point on this budget is not to find new
      # bugs: it is that each target still runs, its seed corpus still passes,
      # and any input committed under testdata/fuzz/ after a past failure stays
      # fixed — Go replays the whole corpus before it generates anything, so a
      # regression fails in the first second.
      - name: Fuzz
        run: ci/fuzz.sh

  private:
    runs-on: ubuntu-latest
    steps:
      # Full history: the check reads commit and tag messages, not just the tree.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      # The terms are supplied by a secret rather than committed — writing down
      # what must not appear here would itself put it here. The check reports
      # file:line only and never echoes a match, so this log stays clean.
      - name: No identifying strings
        env:
          PRIVATE_PATTERNS: ${{ secrets.PRIVATE_PATTERNS }}
        run: ci/ci-check-private.sh

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pre-commit/action installs itself with pip and does not provide a
      # Python. Without this the job depends on whatever the runner image
      # happens to ship, which on a PEP 668 externally-managed interpreter
      # refuses the install outright.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # reuse, detect-secrets, codespell. The repo's Go and JS hooks are
      # skipped here: they need toolchains this job deliberately does not
      # install (js-test needs npm ci for jsdom, not just a Node binary), and
      # the lint, security and test jobs already run exactly those checks.
      # Without the skip they fail with "command not found" / a missing
      # package and report as a hygiene failure, which points at the wrong
      # thing.
      - uses: pre-commit/action@v3.0.1
        env:
          SKIP: go-lint,go-test,go-security,check-private,js-test

  docker-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The lint/security/test/example jobs above already run every one of
      # these checks natively on this runner's own filesystem (ext4). This
      # reruns them pinned to the exact toolchain versions this workflow
      # installs, inside a container on overlay2 -- Docker's default storage
      # driver, and the one real deployments run on. That difference is not
      # academic: init.go's inode-reuse race only reproduced there, never on
      # ext4, so this is the only job that would have caught it.
      - name: CI gate in a container
        run: make docker-gate

  docker-airgap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # ci/example.sh already greps the output for CDN references. This
      # builds the composed example site onto an image with no Go, Hugo or
      # Node at all, runs it with --network none, and fetches the page and
      # its real (fingerprinted) asset URLs from inside that container's own
      # namespace -- proving "works airgapped" by removing the network,
      # rather than by grepping for what should not be there.
      - name: Airgap proof
        run: make docker-airgap
