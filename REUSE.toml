version = 1
SPDX-PackageName = "cairndex"
SPDX-PackageSupplier = "Tim Perkins"
SPDX-PackageDownloadLocation = "https://github.com/livingstaccato/cairndex"

# Files that cannot carry a comment header.
[[annotations]]
path = [
  "go.mod",
  "go.sum",
  ".gitignore",
  ".codespellrc",
  ".golangci.yml",
  ".pre-commit-config.yaml",
  ".secrets.baseline",
  "README.md",
  "CHANGELOG.md",
  "docs/**",
  "ci/bench-site.go.mod.in",
  "ci/bench-site.hugo.toml.in",
  "AGENTS.md",
  ".actrc",
  "commitlint.config.cjs",
  "testdata/**",
  # Templates carry no header of their own: an HTML comment would be copied into
  # every page cairndex generates, licensing a user's output as though it were this
  # project's source.
  "internal/emit/templates/**",
  "layouts/**",
  "assets/cairndex/icons.svg",
  "themes/**",
  "exampleSite/**",
  "exampleSite-corpus/**",
  ".provide/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright (C) 2026 Tim Perkins"
SPDX-License-Identifier = "MIT"
