name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      # false, not true: on an OS matrix a cancelled sibling hides whether the
      # other platform is healthy, which is what a cross-platform run exists to say.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # The gate scripts are POSIX shell; without this the Windows leg would
        # run them under PowerShell.
        shell: bash
    steps:
      # Source
      - uses: actions/checkout@v6
      # Toolchain
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      # Race-enabled suite with a coverage profile over the logic packages
      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./internal/...
      # Coverage floor, enforced per OS so a test that stops running on one
      # platform shows up here as a drop
      - name: Enforce coverage
        run: ci/check-coverage.sh coverage.out 90.0

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      # golangci-lint carries gocyclo, gosec, staticcheck and the rest
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      # gofmt, vet, golangci-lint, file-size budget
      - name: Lint
        run: ci/lint.sh

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      # SAST scanner
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest
      # Go vulnerability database scanner
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      # gosec, govulncheck, go mod verify
      - name: Scan
        run: ci/security.sh

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # reuse, detect-secrets, codespell. The repo's Go hooks are skipped here:
      # they need a toolchain this job deliberately does not install, and the
      # lint, security and test jobs already run exactly those checks. Without
      # the skip they fail with "command not found" and report as a hygiene
      # failure, which points at the wrong thing.
      - uses: pre-commit/action@v3.0.1
        env:
          SKIP: go-lint,go-test,go-security
