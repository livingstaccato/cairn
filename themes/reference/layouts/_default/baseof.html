<!doctype html>
<html lang="{{ site.Language.Lang | default "en" }}">
<head>{{ partial "head.html" . }}</head>
<body>
{{- /* The sprite is inlined once per page: a <use> reference cannot reach into
       an external file without a fetch, which is the thing being avoided. */ -}}
{{ with resources.Get "cairn/icons.svg" }}{{ .Content | safeHTML }}{{ end }}
<main>{{ block "main" . }}{{ end }}</main>
</body>
</html>
