version: 1
mode: hugo
root: ./tree
out: ./content
index_basename: index
on_conflict: error

protect:
  - "dists/**"
  - "repodata/**"
  - "**/Release"

defaults:
  present: styled
  outputs: [html, json, csv, txt]

rules:
  # The page a human browses: checksums shown, sortable, filterable.
  - match: "bootstrap/**"
    present: styled
    checksum: sha256
    outputs: [html, json, csv, txt, sums]

  # The pool's top level also publishes the whole subtree as one tree.json, so a
  # provisioning script finds every package in one request instead of walking
  # the directories.
  - match: "pool"
    present: bare
    checksum: sha256
    recursive: true
    outputs: [html, json, csv, txt, sums]

  # A package pool, served as a plain autoindex — no JavaScript, readable in
  # lynx, which is what most of a mirror should be.
  - match: "pool/**"
    present: bare
    checksum: sha256
    outputs: [html, json, csv, txt, sums]

  - match: "docs/**"
    source: pages
    present: styled

  - match: "external/**"
    source: manifest
    present: styled
