version: 1
mode: direct
root: ./tree
out: ./out
index_basename: index
tree_max_entries: 50000
on_conflict: error

protect:
  - "dists/**"
  - "repodata/**"
  - "**/Release"

# direct mode never invokes Hugo, so only the bare presenter renders: styled
# HTML needs a theme, and there is no site here to take one from.
defaults:
  present: bare
  outputs: [html, json, csv]

rules:
  - match: "bootstrap/**"
    checksum: sha256
    recursive: true
    outputs: [html, json, csv, sums]
