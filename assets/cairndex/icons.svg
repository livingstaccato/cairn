<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- Three stacked stones, not a folder tab: the one glyph in this sprite
       that names the product rather than the filesystem. Ellipses, not
       rounded rects, because the "data" symbol below already established
       ellipse-as-stacked-thing in this family — ellipse and stroke-width
       differ, not the vocabulary. -->
  <symbol id="cairndex-dir" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none">
    <ellipse cx="12" cy="18.5" rx="7" ry="2.8"/>
    <ellipse cx="12.8" cy="13" rx="4.6" ry="2.3" transform="rotate(-6 12.8 13)"/>
    <ellipse cx="11.6" cy="8.2" rx="2.6" ry="1.7" transform="rotate(8 11.6 8.2)"/>
  </symbol>
  <symbol id="cairndex-script" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none">
    <path d="M8 9l-3 3 3 3M16 9l3 3-3 3M13 6l-2 12"/>
  </symbol>
  <symbol id="cairndex-image" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none">
    <rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10.5" r="1.5"/><path d="M21 16l-5-5-6 6"/>
  </symbol>
  <symbol id="cairndex-archive" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none">
    <rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8M10 12h4"/>
  </symbol>
  <symbol id="cairndex-doc" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none">
    <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>
  </symbol>
  <symbol id="cairndex-page" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none">
    <rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/>
  </symbol>
  <symbol id="cairndex-config" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none">
    <circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>
  </symbol>
  <symbol id="cairndex-data" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none">
    <ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  </symbol>
  <symbol id="cairndex-other" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none">
    <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>
  </symbol>
  <symbol id="cairndex-home" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none">
    <path d="M3 11l9-8 9 8"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/>
  </symbol>
</svg>
