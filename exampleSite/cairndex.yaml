version: 1
mode: hugo
root: ./tree
out: ./content
index_basename: index
on_conflict: error

protect:
  - "dists/**"
  - "repodata/**"
  - "**/Release"

defaults:
  present: styled
  outputs: [html, json, csv, txt]

rules:
  # The page a human browses: checksums shown, sortable, filterable.
  - match: "bootstrap/**"
    present: styled
    checksum: sha256
    outputs: [html, json, csv, txt, sums, atom]

  # The pool's top level also publishes the whole subtree as one tree.json, so a
  # provisioning script finds every package in one request instead of walking
  # the directories.
  - match: "pool"
    present: bare
    checksum: sha256
    recursive: true
    outputs: [html, json, csv, txt, sums]

  # A package pool, served as a plain autoindex — no JavaScript, readable in
  # lynx, which is what most of a mirror should be.
  - match: "pool/**"
    present: bare
    checksum: sha256
    outputs: [html, json, csv, txt, sums]

  # Capped hard on purpose: docs/ holds two pages, so the truncation notice and
  # the narrowed filter placeholder render in the example and stay covered.
  - match: "docs/**"
    source: pages
    present: styled
    max_rendered: 1

  - match: "external/**"
    source: manifest
    present: styled

  # A PyPI simple index: pypi/ lists project directories, each project
  # directory lists its own distribution files. outputs: [pep503] replaces
  # the normal listing for a directory entirely -- a page is either a PEP
  # 503 index or a browsable listing, never both.
  - match: "pypi"
    outputs: [pep503]
    pep503_level: root

  # One extra wildcard segment than "each project directory" reads as: this
  # has to match a *file inside* a project directory, not the directory
  # itself, or matchDir's own "the directory holding matching files is
  # covered too" rule (config.go) would also apply this to pypi/ itself and
  # collide with the root-level rule above.
  - match: "pypi/*/*"
    outputs: [pep503]
    pep503_level: project
