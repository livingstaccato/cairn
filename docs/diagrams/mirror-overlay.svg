<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="605px" preserveAspectRatio="none" style="width:1058px;height:605px;background:#FFFFFF;" version="1.1" viewBox="0 0 1058 605" width="1058.3333px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><!--entity InPlace--><g class="entity" data-qualified-name="InPlace" data-source-line="15" id="ent0001"><rect fill="#F7F7F5" height="246.1068" rx="4.1667" ry="4.1667" style="stroke:#444444;stroke-width:0.8333;" width="515.0464" x="11.6667" y="35.1167"/><text fill="#000000" font-family="Helvetica" font-size="21.6667" font-weight="700" lengthAdjust="spacing" textLength="87.9045" x="28.3333" y="68.4671">One tree</text><text fill="#000000" font-family="Helvetica" font-size="21.6667" lengthAdjust="spacing" textLength="387.7889" x="122.2575" y="68.4671">&#8212; root and out name the same directory</text><text fill="#000000" font-family="Helvetica" font-size="21.6667" lengthAdjust="spacing" textLength="6.0197" x="28.3333" y="90.1338">&#160;</text><text fill="#000000" font-family="monospace" font-size="21.6667" lengthAdjust="spacing" textLength="221.7554" x="28.3333" y="115.2282">/srv/mirror/pool/</text><text fill="#000000" font-family="monospace" font-size="21.6667" lengthAdjust="spacing" textLength="352.1997" x="67.4666" y="140.4495">ubuntu.iso&#160;&#160;&#160;&#160;&#160;the&#160;artifact</text><text fill="#000000" font-family="monospace" font-size="21.6667" lengthAdjust="spacing" textLength="378.2886" x="67.4666" y="165.6709">index.html&#160;&#160;&#160;&#160;&#160;cairn&#160;wrote&#160;it</text><text fill="#000000" font-family="monospace" font-size="21.6667" lengthAdjust="spacing" textLength="378.2886" x="67.4666" y="190.8922">index.json&#160;&#160;&#160;&#160;&#160;cairn&#160;wrote&#160;it</text><text fill="#000000" font-family="monospace" font-size="21.6667" lengthAdjust="spacing" textLength="378.2886" x="67.4666" y="216.1136">SHA256SUMS&#160;&#160;&#160;&#160;&#160;cairn&#160;wrote&#160;it</text><text fill="#000000" font-family="Helvetica" font-size="21.6667" lengthAdjust="spacing" textLength="6.0197" x="28.3333" y="237.9072">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="21.6667" lengthAdjust="spacing" textLength="456.3542" x="28.3333" y="259.5739">rsyncs whole; sha256sum -c works where it sits</text></g><!--entity Split--><g class="entity" data-qualified-name="Split" data-source-line="17" id="ent0002"><rect fill="#F7F7F5" height="292.9948" rx="4.1667" ry="4.1667" style="stroke:#444444;stroke-width:0.8333;" width="451.1678" x="585.2667" y="11.6667"/><text fill="#000000" font-family="Helvetica" font-size="21.6667" font-weight="700" lengthAdjust="spacing" textLength="101.1393" x="601.9333" y="45.0171">Two trees</text><text fill="#000000" font-family="Helvetica" font-size="21.6667" lengthAdjust="spacing" textLength="310.6755" x="709.0924" y="45.0171">&#8212; the web server overlays them</text><text fill="#000000" font-family="Helvetica" font-size="21.6667" lengthAdjust="spacing" textLength="6.0197" x="601.9333" y="66.6838">&#160;</text><text fill="#000000" font-family="monospace" font-size="21.6667" lengthAdjust="spacing" textLength="260.8887" x="601.9333" y="91.7782">/srv/artifacts/pool/</text><text fill="#000000" font-family="monospace" font-size="21.6667" lengthAdjust="spacing" textLength="352.1997" x="641.0666" y="116.9995">ubuntu.iso&#160;&#160;&#160;&#160;&#160;the&#160;artifact</text><text fill="#000000" font-family="Helvetica" font-size="21.6667" lengthAdjust="spacing" textLength="6.0197" x="601.9333" y="138.7931">&#160;</text><text fill="#000000" font-family="monospace" font-size="21.6667" lengthAdjust="spacing" textLength="286.9775" x="601.9333" y="163.8875">/srv/site/public/pool/</text><text fill="#000000" font-family="monospace" font-size="21.6667" lengthAdjust="spacing" textLength="378.2886" x="641.0666" y="189.1089">index.html&#160;&#160;&#160;&#160;&